name: Governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile governance tooling
        run: python -m py_compile scripts/validate_governance.py scripts/hive_bootstrap.py scripts/hive_mcp.py
      - name: Validate ISORYN governance
        run: python scripts/validate_governance.py
      - name: Test HIVE bootstrap and MCP bridge
        run: python -m unittest discover -s tests -p "test_*.py" -v
